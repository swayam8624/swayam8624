<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">GitHub engineering telemetry</title>
<desc id="desc">Repository-owned GitHub statistics and leading public repositories.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
</style>
<rect width="1000" height="330" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="999" height="329" rx="15.5" fill="none" stroke="#d0d7de"/>
<text x="30.0" y="42.0" font-size="15" font-weight="800" fill="#7c3aed" text-anchor="start" class="mono">GITHUB // ENGINEERING TELEMETRY</text>
<text x="30.0" y="67.0" font-size="13" font-weight="400" fill="#656d76" text-anchor="start">Generated from GitHub's GraphQL API — no public card service.</text>
