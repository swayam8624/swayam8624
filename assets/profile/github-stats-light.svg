<text x="288.0" y="179.0" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">owned, non-fork repositories</text>
<rect x="510" y="88" width="220" height="105" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="510" y="88" width="4" height="105" rx="2" fill="#1a7f37"/>
