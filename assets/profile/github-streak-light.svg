<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
<title id="title">GitHub contribution streak</title>
<desc id="desc">Current and longest contribution streaks calculated from the GitHub contribution calendar.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
</style>
<rect width="1000" height="220" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="999" height="219" rx="15.5" fill="none" stroke="#d0d7de"/>
<text x="30.0" y="42.0" font-size="15" font-weight="800" fill="#7c3aed" text-anchor="start" class="mono">CONTRIBUTION // STREAK CORE</text>
<text x="30.0" y="66.0" font-size="13" font-weight="400" fill="#656d76" text-anchor="start">Calculated in-repository from contribution-calendar dates.</text>
<rect x="30" y="88" width="290" height="105" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="30" y="88" width="4" height="105" rx="2" fill="#1a7f37"/>
<text x="48.0" y="116.0" font-size="11" font-weight="700" fill="#656d76" text-anchor="start" class="mono">CURRENT STREAK</text>
<text x="48.0" y="156.0" font-size="30" font-weight="750" fill="#1f2328" text-anchor="start">0 days</text>
<text x="48.0" y="179.0" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">No active run</text>
<rect x="355" y="88" width="290" height="105" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="355" y="88" width="4" height="105" rx="2" fill="#7c3aed"/>
<text x="373.0" y="116.0" font-size="11" font-weight="700" fill="#656d76" text-anchor="start" class="mono">LONGEST STREAK</text>
<text x="373.0" y="156.0" font-size="30" font-weight="750" fill="#1f2328" text-anchor="start">17 days</text>
<text x="373.0" y="179.0" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">24 Aug – 09 Sep 2025</text>
<rect x="680" y="88" width="290" height="105" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="680" y="88" width="4" height="105" rx="2" fill="#0969da"/>
<text x="698.0" y="116.0" font-size="11" font-weight="700" fill="#656d76" text-anchor="start" class="mono">ACTIVE DAYS</text>
<text x="698.0" y="156.0" font-size="30" font-weight="750" fill="#1f2328" text-anchor="start">148 · 40%</text>
<text x="698.0" y="179.0" font-size="12" font-weight="400" fill="#656d76" text-anchor="start">peak day: 325 contributions</text>
</svg>